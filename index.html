<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123c32" />
  <title>대피소 찾기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="consent" class="consent" hidden>
    <div class="consent__box">
      <h1>대피소 찾기</h1>
      <p>
        가까운 대피소를 찾기 위해 <b>지금 계신 위치</b>를 사용합니다.<br />
        위치는 대피소를 찾는 데에만 쓰이고 <b>저장하지 않습니다</b>.
      </p>
      <button id="consent-ok" class="btn btn--primary btn--block" type="button">시작하기</button>
    </div>
  </div>

  <header class="header">
    <div class="header__inner">
      <div class="header__brand">
        <span class="header__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 2.8 4.5 6v5.5c0 4.7 3.2 8.8 7.5 9.9 4.3-1.1 7.5-5.2 7.5-9.9V6L12 2.8Z"/><path d="M12 7.2v8.7M8.5 11.4h7"/></svg>
        </span>
        <div>
          <p class="header__eyebrow">생활 속 안전지킴이</p>
          <h1 class="header__title">내 근처 대피소</h1>
        </div>
      </div>
      <p id="place" class="header__place">내 위치를 찾는 중입니다…</p>
      <button id="text-size" class="header__size" type="button">
        <span class="header__size-glyph" aria-hidden="true">가</span>
        <span id="text-size-label" class="header__size-label">보통</span>
      </button>
    </div>
    <!-- 도봉산 능선. 화강암 봉우리가 솟은 모습을 옮겼다.
         왼쪽부터 선인봉, 만장봉, 자운봉을 떠올리며 그렸다. -->
    <svg class="header__ridge" viewBox="0 0 375 60" preserveAspectRatio="none"
         aria-hidden="true" focusable="false">
      <path class="header__ridge-far"
            d="M0 60 L0 42 L46 24 L78 34 L118 12 L156 30 L196 8 L232 26
               L268 16 L306 32 L340 22 L375 34 L375 60 Z" />
      <path class="header__ridge-near"
            d="M0 60 L0 52 L34 44 L62 50 L92 32 L116 44 L146 26 L170 40
               L200 20 L226 38 L258 30 L292 44 L322 36 L352 46 L375 42 L375 60 Z" />
    </svg>
  </header>

  <div class="content-shell">
    <section class="filter-panel" aria-labelledby="filter-title">
      <div class="section-heading">
        <h2 id="filter-title">대피소 종류</h2>
        <span>원하는 시설을 선택하세요</span>
      </div>
      <div id="chips" class="chips" role="radiogroup" aria-label="대피소 종류 고르기"></div>
    </section>

    <div class="map-frame">
      <div class="map-frame__label"><span aria-hidden="true">●</span> 내 주변 지도</div>
      <div id="map" class="map" role="img" aria-label="주변 대피소 지도"></div>
    </div>

    <section id="fallback" class="fallback" hidden>
    <h2 id="fallback-title" class="fallback__title">지금 계신 곳을 알 수 없습니다</h2>
    <p id="fallback-help" class="fallback__help">동네 이름을 넣고 <b>찾기</b>를 눌러주세요.</p>
    <div class="fallback__row">
      <input id="addr" type="text" inputmode="search" placeholder="예: 강남구 도곡동" />
      <button id="addr-go" class="btn btn--primary" type="button">찾기</button>
    </div>
    <p id="addr-error" class="error" hidden></p>
    <button id="retry-location" class="btn fallback__retry" type="button">현재 위치 다시 찾기</button>
    </section>

  <p id="loading" class="loading" role="status" hidden>
    <span class="loading__spinner" aria-hidden="true"></span>
    <span id="loading-text">내 위치를 찾는 중입니다…</span>
  </p>

  <p id="spoken" class="spoken" role="status" hidden></p>

    <div class="list-head">
      <span id="total" class="list-head__total"></span>
      <label class="list-head__sort">
        <span class="sr-only">목록 순서</span>
        <select id="sort">
          <option value="distance">거리순</option>
          <option value="favorite">즐겨찾기순</option>
        </select>
      </label>
    </div>

    <main id="list" class="list" aria-live="polite" aria-busy="false"></main>
  </div>

  <footer class="footer">
    <button id="speak" class="btn btn--wide footer__button" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="M17 9.5c1.4 1.4 1.4 3.6 0 5M19.5 7c2.8 2.8 2.8 7.2 0 10"/></svg>
      소리로 듣기
    </button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
