<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>대피소 찾기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="consent" class="consent" hidden>
    <div class="consent__box">
      <h1>대피소 찾기</h1>
      <p>
        가까운 대피소를 찾기 위해 <b>지금 계신 위치</b>를 사용합니다.<br />
        위치는 대피소를 찾는 데에만 쓰이고 <b>저장하지 않습니다</b>.
      </p>
      <button id="consent-ok" class="btn btn--primary btn--block" type="button">시작하기</button>
    </div>
  </div>

  <header class="header">
    <h1 class="header__title">내 근처 대피소</h1>
    <p id="place" class="header__place">내 위치를 찾는 중입니다…</p>
  </header>

  <nav id="chips" class="chips" aria-label="대피소 종류 고르기"></nav>

  <div id="map" class="map" role="img" aria-label="주변 대피소 지도"></div>

  <section id="fallback" class="fallback" hidden>
    <h2 id="fallback-title" class="fallback__title">지금 계신 곳을 알 수 없습니다</h2>
    <p id="fallback-help" class="fallback__help">동네 이름을 넣고 <b>찾기</b>를 눌러주세요.</p>
    <div class="fallback__row">
      <input id="addr" type="text" inputmode="search" placeholder="예: 강남구 도곡동" />
      <button id="addr-go" class="btn btn--primary" type="button">찾기</button>
    </div>
    <p id="addr-error" class="error" hidden></p>
    <button id="retry-location" class="btn fallback__retry" type="button">현재 위치 다시 찾기</button>
  </section>

  <p id="loading" class="notice" hidden>대피소를 찾고 있습니다…</p>

  <p id="spoken" class="spoken" role="status" hidden></p>

  <main id="list" class="list" aria-live="polite" aria-busy="false"></main>

  <footer class="footer">
    <button id="speak" class="btn btn--wide" type="button">소리로 듣기</button>
    <button id="share" class="btn btn--wide" type="button">가족에게</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
