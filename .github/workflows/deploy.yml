name: 배포

# main 에 올라가면 테스트를 돌리고, 통과할 때만 배포한다.
# 테스트가 깨진 앱이 배포되는 일을 막는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 이상이어야 node --test 가 glob 패턴을 받는다
          node-version: '22'

      - name: 테스트
        run: npm test

      - name: 배포용 폴더 만들기
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
